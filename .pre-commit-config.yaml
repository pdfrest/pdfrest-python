# For info on multiline regular expressions: https://pre-commit.com/index.html#regular-expressions
# Verbose regular expressions '(?x)': https://docs.python.org/3.9/library/re.html#re.X
exclude: |
  (?x)^(
      .idea/|
      .venv/
      )
default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]
default_stages: [pre-commit, pre-merge-commit, pre-push, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=4000]
  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        exclude: .md$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.34.0
    hooks:
      - id: check-github-workflows
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.4.0
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        name: mdformat on non-.github files
        exclude: ^(.github/|docs/)
        args: ["--wrap", "80", "--number"]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
          - mdformat-footnote
          - mdformat-toc
      - id: mdformat
        name: mdformat on .github files
        files: ^.github/.*$
        args: ["--wrap", "no", "--number"]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
          - mdformat-footnote
          - mdformat-toc
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]
  - repo: https://github.com/maxwinterstein/shfmt-py
    rev: v3.12.0.1
    hooks:
      - id: shfmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
      - id: toml-sort-fix
        exclude: ^uv\.lock$
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.8.24
    hooks:
      - id: uv-lock
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1.34.0 # or whatever the latest version is at the time
    hooks:
      - id: basedpyright

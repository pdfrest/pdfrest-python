# For info on multiline regular expressions: https://pre-commit.com/index.html#regular-expressions
# Verbose regular expressions '(?x)': https://docs.python.org/3.9/library/re.html#re.X
exclude: |
  (?x)^(
      .idea/|
      .venv/
      )
default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]
default_stages: [pre-commit, pre-merge-commit, pre-push, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Preserve service inputs, vendored bytes, and immutable ignore modules.
        exclude: (^\.cit-quality/vendor/|^\.gitignore$|^(tests/resources/|examples/resources/)(?!.*\.pyi?$))
      - id: end-of-file-fixer
        exclude: (^\.cit-quality/vendor/|^\.gitignore$|^(tests/resources/|examples/resources/)(?!.*\.pyi?$))
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
        # Public test fixture for the self-signed pdfrest-test certificate.
        exclude: ^tests/resources/signing_key\.pem$
      - id: check-added-large-files
        args: [--maxkb=4000]
  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        exclude: (\.md$|^(tests/resources/|examples/resources/)(?!.*\.pyi?$))
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.1
    hooks:
      - id: check-github-workflows
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        # The upstream macOS ignore module contains literal carriage returns.
        exclude: (^\.cit-quality/vendor/|^\.gitignore$|^(tests/resources/|examples/resources/)(?!.*\.pyi?$))
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        name: mdformat on non-.github files
        exclude: ^(\.github/|docs/|tests/resources/|examples/resources/)
        args: ["--wrap", "80", "--number"]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
          - mdformat-footnote
          - mdformat-toc
      - id: mdformat
        name: mdformat on .github files
        files: ^.github/.*$
        args: ["--wrap", "no", "--number"]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-frontmatter
          - mdformat-footnote
          - mdformat-toc
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [--write]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        exclude: ^\.cit-quality/vendor/
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        exclude: ^\.cit-quality/vendor/
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.25.0
    hooks:
      - id: toml-sort-fix
        exclude: ^uv\.lock$
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.18
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: check-nfc-filenames
        name: Check tracked filename NFC normalization
        entry: uv run --script .cit-quality/vendor/check_nfc_filenames.py
        language: system
        pass_filenames: false
        always_run: true
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen basedpyright
        language: system
        pass_filenames: false
        always_run: true

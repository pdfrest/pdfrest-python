name: pre-commit

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature-*

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.8.22
          python-version: 3.11
          enable-cache: true
          cache-suffix: pre-commit
          cache-dependency-glob: uv.lock
      - name: Restore pre-commit cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pre-commit-cache
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py3.11-uv0.8.22-pre-commit4.3.0-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ runner.arch }}-py3.11-uv0.8.22-pre-commit4.3.0-
      - name: Synchronize project dependencies
        run: uv sync --frozen --group dev
      - name: Run pre-commit checks
        run: uv run --frozen pre-commit run --show-diff-on-failure --all-files
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit-cache
